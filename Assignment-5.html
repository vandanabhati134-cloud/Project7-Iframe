<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="fontawesome-free-7.3.1-web/css/all.min.css">
    <style>
        .con{
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;

        }
        .box{
            height: 80%;
            width: 80%;
            border-radius: 20px;
            display: flex;
        }
        .left,.center,.right{
            height: 100%;
        }
        .left{
            background-color: navy;
            width: 2%;
            border-radius: 30px;
        }
        .center{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 63%;
            font-size: 50px;
            color: navy;
            background-color: whitesmoke;

        }
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .right{
            width:35%;
            box-shadow: 10px 10px 10px;
            border-radius: 20PX;
        }
        .top{
            height: 30%;
        }
        .bottom{
            height: 70%;
        }
        .top-in{
            height: 90%;
            background-color: navy;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .circle{
            position: absolute;
            top:13%;
            right: 20%;
            height: 120px;
            width: 120px;
            border: 5px solid navy;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        img{
            height: 100%;
            width: 100%;
            border-radius: 50%;
            border: 2px solid white;
        }
        .button{
            height: 20%;
            display: flex;
            align-items: center;
            justify-content: space-evenly;

        }
        .sub{
            height: 50%;
            width: 40%;
            border: 1px solid black;
            background-color: navy;
            border-radius: 40px;
            text-align: center;
            color: azure;
            padding-top: 5px;
        }
        .bottom1{
            border-radius: 20px;
            text-align: center;
            color: white;
            line-height: 40px;
            height: 50%;
            width: 40%;
            background-color: navy;


        }
        .icon,.last{
            display: flex;
            justify-content: space-evenly;
            height: 20%;
            align-items: center;
        }
        .fa-facebook{
            color: blue;
        }
        .fa-linkedin{
            color: skyblue;
        }
        .fa-github{
            color: violet;
        }
        .fa-behance{
            color: green;
        }
        .fa-heart{
            color: red;
        }
        .button>h1{
            text-align: center;
            margin-top: 20px;

        }
        .fa-instagram{
            background: linear-gradient( red, orange);
            color: transparent;
            background-clip: text;
        }
 </style>
</head>
<body>

    <div class="con">
        <div class="box">
            <div class="left"></div>
            <div class="center"> 
                <h1>Profile Card UI-UX Design</h1>
            </div>
            <div class="right">
                <div class="top">
                    <div class="top-in">
                        <div class="circle">
                            <img src="sea image.png" alt="">
                            
                        </div>
                    </div>
                </div>
                <div class="bottom">
                    <h1 align="center">Website Development</h1>
                    <h1 align="center">Dezyne École College</h1>
                    <h1 align="center">BCA First Year</h1>
                    
                    <div class="icon">
                        <i class="fa fa-brands fa-facebook fa-2x"></i>
                        <i class="fa fa-brands fa-linkedin fa-2x"></i>
                        <i class="fa fa-brands fa-github fa-2x"></i>
                        <i class="fa fa-brands fa-behance fa-2x"></i>
                        <i class="fa fa-brands fa-instagram fa-2x"></i>
                    </div>
                    <div class="button">
                    <div class="sub">Subscribe</div>
                    <div class="sub">Message</div>
                    </div>
                        <div class="last">
                            <i class="fa fa-solid fa-heart fa-1x"></i>160k
                            <i class="fa fa-solid fa-comment fa-1x"></i>2.3k
                            <i class="fa fa-solid fa-share fa-flip-horizontal  fa-1x"></i>12.6k
                            
                        </div>
                    </div>
                    </div>
                </div>
            </div>
        </div>
</body>
</html>
