<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            height: 600px;
            border: 1px solid black;
        }
        .header{
            height: 20%;
            background-color: teal;

        }
        .footer{
            height: 20%;
            background-color: aquamarine;
        }
        .center{
            height: 60%;
            background-color: brown;
            display: flex;
        }
        .left{
            height: 100%;
            width: 20%;
            background-color: coral;
             
        }
        .right{
            height: 100%;
            width: 80%;
            background-color: yellow;
        }
        .top{
            height: 50%;
            background-color: aqua;
        }
        .bottom{
            height: 50%;
            background-color: blue;
            display: flex;
        }
        .bottom1b1{
            height: 100%;
            width: 50%;
            background-color: darkkhaki;
            
        }
         .bottom1b2{
            height: 100%;
            width: 50%;
              background-color: hotpink;
         }


    </style>
</head>
<body>
    <h1 align="center">flex-box </h1>
    <div class="con">
        <div class="header"></div>
        <div class="center">
            <div class="left"></div>
            <div class="right">
                <div class="top"></div>
                 <div class="bottom">
                    <div class="bottom1b1"></div>
                    <div class="bottom1b2"></div>
                 </div>
            </div>
        </div>
        <div class="footer"></div>
    </div>
</body>
</html>
